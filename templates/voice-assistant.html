<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Assistant | Reminders App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data:; font-src 'self' https://cdn.jsdelivr.net; connect-src 'self'">
    <style>
        body {
            background-color: #f8f9fa;
            padding: 20px;
        }
        .assistant-card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 20px;
            margin-bottom: 20px;
            position: relative;
        }
        .voice-btn {
            position: absolute;
            right: 20px;
            top: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #0d6efd;
            color: white;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .voice-btn.listening {
            background: #dc3545;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        .reminder-item {
            padding: 1rem;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }
        .reminder-item:hover {
            background-color: #f8f9fa;
        }
        .priority-high {
            border-left: 4px solid #dc3545;
        }
        .priority-medium {
            border-left: 4px solid #ffc107;
        }
        .priority-low {
            border-left: 4px solid #198754;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="assistant-card">
            <div class="assistant-header">
                <h3><i class="fas fa-microphone me-2"></i>Voice Assistant</h3>
            </div>
            <div class="assistant-response" id="assistantResponse">
                <div class="text-center">
                    <i class="fas fa-cog fa-spin fa-2x mb-3"></i>
                    <p>Initializing voice assistant...</p>
                </div>
            </div>
            <button id="voiceBtn" class="voice-btn">
                <i class="fas fa-microphone"></i>
            </button>
        </div>
        
        <div class="card mt-4">
            <div class="card-header bg-white">
                <h5 class="mb-0"><i class="fas fa-list me-2"></i>Your Reminders</h5>
            </div>
            <div class="card-body p-0">
                <ul class="reminders-list" id="remindersList">
                    <!-- Reminders will be loaded by renderer.js -->
                </ul>
            </div>
        </div>
    </div>

    <!-- Load renderer script -->
    <script src="renderer.js"></script>
</body>
</html>
